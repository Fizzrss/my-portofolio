  <rect x="70" y="190" width="216" height="42" rx="10" fill="#38bdf8" opacity="0.15"/>
  <text x="100" y="217" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">● Equipment Catalog</text>
  <text x="100" y="270" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">○ Reservations</text>
  <text x="100" y="320" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">○ Invoices &amp; Billing</text>
  <text x="100" y="370" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">○ Tenant Settings</text>

  <!-- Main Content: Stat Cards Row -->
  <rect x="336" y="120" width="340" height="130" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  <text x="366" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Total Active Units</text>
  <text x="366" y="210" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="34" font-weight="800">148 Units</text>
  <text x="590" y="210" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="600">96.4% On Schedule</text>

  <rect x="704" y="120" width="340" height="130" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
