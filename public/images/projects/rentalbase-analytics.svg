  <text x="680" y="377" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">CATEGORY</text>
  <text x="900" y="377" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">STATUS</text>
  <text x="1120" y="377" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">RENTAL DURATION</text>
  <text x="1350" y="377" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ACTION</text>

  <!-- Row 1 -->
  <rect x="360" y="410" width="1104" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
  <text x="390" y="446" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Total Station Leica TS07</text>
  <text x="680" y="446" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Surveying Unit</text>
  <rect x="900" y="426" width="100" height="26" rx="6" fill="#10b981" opacity="0.2"/>
  <text x="950" y="444" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Available</text>
  <text x="1120" y="446" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">7 Days Contract</text>
  <rect x="1335" y="424" width="80" height="28" rx="6" fill="#38bdf8"/>
  <text x="1375" y="443" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Book</text>

