  <text x="734" y="210" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="34" font-weight="800">24 Invoices</text>
  <text x="960" y="210" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Automated Sync</text>

  <rect x="1072" y="120" width="416" height="130" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  <text x="1102" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Database Engine</text>
