  <rect x="360" y="485" width="1104" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
  <text x="390" y="521" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Hydraulic Excavator CAT 320</text>
  <text x="680" y="521" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Heavy Equipment</text>
  <rect x="900" y="501" width="90" height="26" rx="6" fill="#f59e0b" opacity="0.2"/>
  <text x="945" y="519" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Reserved</text>
  <text x="1120" y="521" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">14 Days Contract</text>
  <rect x="1335" y="499" width="80" height="28" rx="6" fill="#334155"/>
  <text x="1375" y="518" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">View</text>

  <!-- Row 3 -->
  <rect x="360" y="560" width="1104" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
  <text x="390" y="596" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Diesel Generator 50 kVA</text>
  <text x="680" y="596" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Power Supply</text>
  <rect x="900" y="576" width="100" height="26" rx="6" fill="#10b981" opacity="0.2"/>
  <text x="950" y="594" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Available</text>
  <text x="1120" y="596" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">3 Days Contract</text>
  <rect x="1335" y="574" width="80" height="28" rx="6" fill="#38bdf8"/>
  <text x="1375" y="593" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Book</text>

  <!-- Row 4 -->
  <rect x="360" y="635" width="1104" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
  <text x="390" y="671" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Theodolite Digital Topcon DT-200</text>
  <text x="680" y="671" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Optical Device</text>
  <rect x="900" y="651" width="100" height="26" rx="6" fill="#ef4444" opacity="0.2"/>
  <text x="950" y="669" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Maintenance</text>
  <text x="1120" y="671" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Scheduled Calibration</text>
  <rect x="1335" y="649" width="80" height="28" rx="6" fill="#334155"/>
  <text x="1375" y="668" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Logs</text>
</svg>

