<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 816" width="1536" height="816">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1536" height="816" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="300" fill="#38bdf8" opacity="0.08" filter="blur(60px)"/>
  <circle cx="1300" cy="700" r="350" fill="#818cf8" opacity="0.08" filter="blur(70px)"/>

  <!-- Top App Navigation Bar Mockup -->
  <rect x="48" y="32" width="1440" height="64" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="80" cy="64" r="8" fill="#ef4444"/>
  <circle cx="106" cy="64" r="8" fill="#f59e0b"/>
  <circle cx="132" cy="64" r="8" fill="#10b981"/>
  <rect x="180" y="50" width="160" height="28" rx="8" fill="#0f172a"/>
  <text x="260" y="69" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">RentalBase / Inventory</text>
  <rect x="1300" y="48" width="150" height="32" rx="8" fill="url(#accentGrad)"/>
  <text x="1375" y="69" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">+ New Reservation</text>

  <!-- Left Sidebar -->
  <rect x="48" y="120" width="260" height="660" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
