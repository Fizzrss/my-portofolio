<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-lab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow-lab" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" fill="url(#bg-lab)"/>

  <!-- Browser Window Mockup -->
  <g filter="url(#shadow-lab)">
    <!-- Browser Frame -->
    <rect x="70" y="55" width="660" height="420" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <path d="M 70 71 A 16 16 0 0 1 86 55 L 714 55 A 16 16 0 0 1 730 71 L 730 96 L 70 96 Z" fill="#1e293b"/>
    
    <!-- Window Controls -->
    <circle cx="95" cy="76" r="5" fill="#f87171"/>
    <circle cx="112" cy="76" r="5" fill="#fbbf24"/>
    <circle cx="129" cy="76" r="5" fill="#34d399"/>
    
    <!-- Address Bar -->
    <rect x="155" y="65" width="340" height="22" rx="6" fill="#334155"/>
    <circle cx="170" cy="76" r="3" fill="#60a5fa"/>
    <text x="182" y="80" font-family="monospace" font-size="11" fill="#cbd5e1" font-weight="600">lab-rpl.polinema.ac.id</text>

    <!-- Navbar inside Web -->
    <rect x="70" y="96" width="660" height="50" fill="#0f172a"/>
    <circle cx="105" cy="121" r="14" fill="#3b82f6"/>
    <text x="100" y="126" font-family="sans-serif" font-size="12" fill="#ffffff" font-weight="800">SE</text>
    <text x="130" y="125" font-family="sans-serif" font-size="13" fill="#ffffff" font-weight="700">Lab RPL Polinema</text>
    
    <text x="440" y="125" font-family="sans-serif" font-size="10" fill="#94a3b8">Profil</text>
    <text x="490" y="125" font-family="sans-serif" font-size="10" fill="#94a3b8">Riset & PBL</text>
    <text x="570" y="125" font-family="sans-serif" font-size="10" fill="#94a3b8">Inventaris</text>
    <rect x="635" y="109" width="70" height="25" rx="6" fill="#2563eb"/>
    <text x="653" y="125" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="600">Login</text>

    <!-- Hero Section -->
    <rect x="70" y="146" width="660" height="150" fill="#1e293b"/>
    <text x="105" y="195" font-family="sans-serif" font-size="22" fill="#ffffff" font-weight="800">Laboratorium Rekayasa Perangkat Lunak</text>
    <text x="105" y="222" font-family="sans-serif" font-size="12" fill="#94a3b8">Pusat Keunggulan Rekayasa Sistem, SQA, dan Pengembangan Solusi Berbasis Industri Polinema.</text>
    
    <rect x="105" y="242" width="120" height="32" rx="8" fill="#3b82f6"/>
    <text x="122" y="262" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="700">Jelajahi Lab</text>
    
    <rect x="235" y="242" width="130" height="32" rx="8" fill="transparent" stroke="#475569"/>
    <text x="250" y="262" font-family="sans-serif" font-size="11" fill="#cbd5e1" font-weight="600">Daftar Inventaris</text>

    <!-- Content Columns -->
    <rect x="105" y="315" width="160" height="135" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="130" cy="340" r="12" fill="#dbeafe"/>
    <text x="150" y="344" font-family="sans-serif" font-size="11" fill="#0f172a" font-weight="700">Fasilitas & Server</text>
    <rect x="120" y="365" width="130" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="120" y="380" width="110" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="120" y="395" width="125" height="6" rx="3" fill="#e2e8f0"/>

    <rect x="280" y="315" width="160" height="135" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="305" cy="340" r="12" fill="#dcfce7"/>
    <text x="325" y="344" font-family="sans-serif" font-size="11" fill="#0f172a" font-weight="700">Manajemen PBL</text>
    <rect x="295" y="365" width="130" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="295" y="380" width="110" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="295" y="395" width="125" height="6" rx="3" fill="#e2e8f0"/>

    <rect x="455" y="315" width="240" height="135" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="480" cy="340" r="12" fill="#fef3c7"/>
    <text x="500" y="344" font-family="sans-serif" font-size="11" fill="#0f172a" font-weight="700">DataTables & Rekap</text>
    <rect x="470" y="365" width="210" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="470" y="392" width="210" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="470" y="419" width="210" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
</svg>

