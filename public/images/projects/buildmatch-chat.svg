<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 816" width="1536" height="816">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1e38"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b34"/>
      <stop offset="100%" stop-color="#24284d"/>
    </linearGradient>
    <linearGradient id="primaryGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1536" height="816" fill="url(#bgGrad2)"/>
  <circle cx="300" cy="200" r="300" fill="#6366f1" opacity="0.1" filter="blur(70px)"/>
  <circle cx="1200" cy="600" r="350" fill="#a855f7" opacity="0.1" filter="blur(80px)"/>

  <!-- Top Mockup Header -->
  <rect x="48" y="32" width="1440" height="64" rx="16" fill="#181b34" stroke="#2e345f" stroke-width="1.5"/>
  <circle cx="80" cy="64" r="8" fill="#ef4444"/>
  <circle cx="106" cy="64" r="8" fill="#f59e0b"/>
  <circle cx="132" cy="64" r="8" fill="#10b981"/>
  <text x="280" y="69" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">BuildMatch Mobile — Real-Time Consultation &amp; Bidding Suite</text>
  <rect x="1330" y="48" width="120" height="32" rx="8" fill="url(#primaryGrad2)"/>
  <text x="1390" y="69" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Active Bid</text>

  <!-- Left Phone Mockup Screen: Consultation Chat -->
  <g transform="translate(140, 130)">
    <rect width="360" height="640" rx="36" fill="#0f1123" stroke="#3b4279" stroke-width="4"/>
    <!-- Phone Notch -->
    <rect x="110" y="12" width="140" height="22" rx="11" fill="#1e2246"/>
    <!-- App Bar -->
    <rect x="20" y="50" width="320" height="50" rx="12" fill="#1e2246"/>
    <circle cx="48" cy="75" r="14" fill="#6366f1"/>
    <text x="75" y="73" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Arch. Hendra Pratama</text>
    <text x="75" y="87" fill="#10b981" font-family="system-ui, sans-serif" font-size="10">● Online | IAI Certified</text>

    <!-- Chat Messages -->
    <rect x="20" y="120" width="240" height="60" rx="14" fill="#242a56"/>
    <text x="35" y="145" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Halo, kami telah mereview</text>
    <text x="35" y="163" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">desain layout 2 lantai Anda.</text>

    <rect x="100" y="195" width="240" height="50" rx="14" fill="url(#primaryGrad2)"/>
    <text x="115" y="217" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Baik pak, estimasi RAB pondasi</text>
    <text x="115" y="233" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">bisa disesuaikan?</text>

    <!-- Proposal Attachment Card inside Chat -->
    <rect x="20" y="260" width="280" height="110" rx="16" fill="#1e2246" stroke="#434c8c" stroke-width="1"/>
    <text x="40" y="290" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">PROPOSAL PENAWARAN (RAB)</text>
    <text x="40" y="315" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Rp 485.000.000,-</text>
    <text x="40" y="340" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Termasuk Arsitektur + ME + Finishing</text>
    <rect x="40" y="380" width="280" height="36" rx="10" fill="#10b981"/>
    <text x="180" y="403" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Setujui Kontrak Bidding</text>
  </g>

  <!-- Right Phone Mockup Screen: Milestone Tracker -->
  <g transform="translate(560, 130)">
    <rect width="360" height="640" rx="36" fill="#0f1123" stroke="#3b4279" stroke-width="4"/>
    <rect x="110" y="12" width="140" height="22" rx="11" fill="#1e2246"/>
    <rect x="20" y="50" width="320" height="50" rx="12" fill="#1e2246"/>
    <text x="40" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Project Milestone Status</text>

    <!-- Milestone 1 Completed -->
    <circle cx="45" cy="140" r="14" fill="#10b981"/>
    <text x="45" y="145" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">✓</text>
    <text x="75" y="137" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Site Survey &amp; Land Prep</text>
    <text x="75" y="153" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">Completed (100%) • Verified</text>

    <!-- Connector Line -->
    <line x1="45" y1="160" x2="45" y2="210" stroke="#3b4279" stroke-width="3"/>

    <!-- Milestone 2 Active -->
    <circle cx="45" cy="225" r="14" fill="#6366f1"/>
    <text x="45" y="230" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">2</text>
    <text x="75" y="222" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Structural Framing</text>
    <text x="75" y="238" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11">In Progress (65%) • ETA: 12 Nov</text>

    <!-- Connector Line -->
    <line x1="45" y1="245" x2="45" y2="295" stroke="#3b4279" stroke-width="3"/>

    <!-- Milestone 3 Pending -->
    <circle cx="45" cy="310" r="14" fill="#242a56"/>
    <text x="45" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">3</text>
    <text x="75" y="307" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Interior &amp; Plumbing</text>
    <text x="75" y="323" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Upcoming Stage</text>

    <!-- Progress Indicator Card -->
    <rect x="25" y="380" width="310" height="150" rx="20" fill="url(#cardGrad2)" stroke="#3b4279" stroke-width="1"/>
    <text x="45" y="415" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Overall Construction Progress</text>
    <text x="45" y="460" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="36" font-weight="800">55%</text>
    <rect x="45" y="480" width="270" height="10" rx="5" fill="#0f1123"/>
    <rect x="45" y="480" width="148" height="10" rx="5" fill="url(#primaryGrad2)"/>
  </g>

  <!-- Right Side Summary Card -->
  <g transform="translate(980, 130)">
    <rect width="450" height="640" rx="28" fill="url(#cardGrad2)" stroke="#2e345f" stroke-width="1.5"/>
    <text x="40" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Architecture &amp; Features</text>
    <text x="40" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" line-height="24">
      • Flutter SDK + Dart with Riverpod state management
    </text>
    <text x="40" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">
      • Supabase PostgreSQL backend with Row Level Security
    </text>
    <text x="40" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">
      • Real-time chat with presence &amp; quotation attachments
    </text>
    <text x="40" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">
      • Geo-distance query for nearest verified contractors
    </text>

    <!-- Testing stats badge -->
    <rect x="40" y="240" width="370" height="140" rx="18" fill="#0f1123" stroke="#3b4279" stroke-width="1"/>
    <text x="65" y="280" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">User Acceptance &amp; Black Box</text>
    <text x="65" y="325" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="32" font-weight="800">33 Respondents</text>
    <text x="65" y="355" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Validated usability &amp; reliability score</text>
  </g>
</svg>

