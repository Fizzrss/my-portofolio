<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="overlay-sr" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow-sr" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Stage / Auditorium Scene -->
  <rect width="800" height="500" fill="url(#bg-sr)"/>
  
  <!-- Subtle Stage Spotlight effects -->
  <path d="M 0 0 L 300 500 L 500 500 L 800 0 Z" fill="#60a5fa" opacity="0.15"/>
  <circle cx="400" cy="220" r="180" fill="#93c5fd" opacity="0.1" filter="url(#glow-sr)"/>

  <!-- Presentation Stage Screen Mockup -->
  <rect x="160" y="70" width="480" height="260" rx="16" fill="#ffffff" opacity="0.95"/>
  <rect x="180" y="90" width="440" height="220" rx="10" fill="#0f172a"/>
  
  <!-- Content on Event Screen -->
  <text x="210" y="135" font-family="sans-serif" font-size="12" fill="#60a5fa" font-weight="700" letter-spacing="2">UKM PENDIDIKAN &amp; PENALARAN POLINEMA</text>
  <text x="210" y="175" font-family="sans-serif" font-size="24" fill="#ffffff" font-weight="800">SCIENTIFIC RESEARCH</text>
  <text x="210" y="205" font-family="sans-serif" font-size="14" fill="#94a3b8">Internal Scientific Competition &amp; Exhibition</text>
  
  <rect x="210" y="230" width="130" height="28" rx="14" fill="#2563eb"/>
  <text x="232" y="249" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="700">Event Execution</text>

  <rect x="355" y="230" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="375" y="249" font-family="sans-serif" font-size="11" fill="#94a3b8" font-weight="600">Research Division</text>

  <!-- Podium and Speaker Silhouette -->
  <g fill="#1e293b">
    <!-- Podium -->
    <path d="M 460 380 L 510 380 L 500 470 L 470 470 Z"/>
    <rect x="450" y="375" width="70" height="10" rx="4"/>
    
    <!-- Coordinator Figure Silhouette -->
    <circle cx="485" cy="335" r="16"/>
    <path d="M 465 355 Q 485 348 505 355 L 500 420 L 470 420 Z"/>
  </g>

  <!-- Audience Silhouettes at the bottom -->
  <g fill="#0b1120">
    <ellipse cx="120" cy="500" rx="45" ry="50"/>
    <ellipse cx="230" cy="510" rx="55" ry="60"/>
    <ellipse cx="340" cy="495" rx="45" ry="45"/>
    <ellipse cx="580" cy="505" rx="50" ry="55"/>
    <ellipse cx="680" cy="495" rx="45" ry="50"/>
    <ellipse cx="770" cy="510" rx="50" ry="55"/>
  </g>

  <!-- Dark Gradient Bottom Overlay -->
  <rect width="800" height="500" fill="url(#overlay-sr)"/>

  <!-- Event Caption Tag at bottom left -->
  <rect x="40" y="420" width="310" height="48" rx="12" fill="#0f172a" opacity="0.9" stroke="#334155"/>
  <text x="56" y="442" font-family="sans-serif" font-size="11" fill="#60a5fa" font-weight="700">DOCUMENTATION HIGHLIGHT</text>
  <text x="56" y="457" font-family="sans-serif" font-size="10" fill="#cbd5e1">Scientific Research Event Coordination &amp; Execution</text>
</svg>

