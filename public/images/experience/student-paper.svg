<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="overlay-sp" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1c1917" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background Warm Study / Administrative Desk Scene -->
  <rect width="800" height="500" fill="url(#bg-sp)"/>

  <!-- Geometric & Paper Motifs -->
  <g opacity="0.12" stroke="#fef3c7" stroke-width="1.5" fill="none">
    <rect x="80" y="60" width="200" height="280" rx="8" transform="rotate(-6 180 200)"/>
    <rect x="520" y="80" width="180" height="260" rx="8" transform="rotate(8 610 210)"/>
  </g>

  <!-- Center Focal: Administrative Desk & Secretariat Board -->
  <g transform="translate(180, 60)">
    <!-- Clipboard / Document Board -->
    <rect x="0" y="0" width="440" height="300" rx="16" fill="#ffffff" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.25))"/>
    
    <!-- Header of Document -->
    <rect x="0" y="0" width="440" height="60" rx="16" fill="#292524"/>
    <rect x="0" y="44" width="440" height="16" fill="#292524"/>
    
    <!-- Clip -->
    <rect x="170" y="-12" width="100" height="24" rx="8" fill="#78716c"/>
    <circle cx="220" cy="0" r="5" fill="#e7e5e4"/>

    <!-- Document Title -->
    <text x="24" y="36" font-family="sans-serif" font-size="13" fill="#fde68a" font-weight="700">SECRETARIAT &amp; PROPOSAL MANAGEMENT</text>
    
    <!-- Paper Content Mockup -->
    <g transform="translate(24, 80)">
      <text x="0" y="20" font-family="sans-serif" font-size="18" fill="#1c1917" font-weight="800">Student Scientific Paper 2024</text>
      <text x="0" y="40" font-family="sans-serif" font-size="11" fill="#78716c">Campus Bureaucracy Permits, Archiving &amp; Administration</text>

      <!-- Checklist Items -->
      <g transform="translate(0, 60)">
        <circle cx="10" cy="10" r="8" fill="#dcfce7"/>
        <path d="M 6 10 L 9 13 L 14 7" stroke="#16a34a" stroke-width="2" fill="none"/>
        <text x="28" y="14" font-family="sans-serif" font-size="11" fill="#292524" font-weight="600">Event Proposal &amp; Institutional Approval</text>
        <rect x="310" y="3" width="70" height="18" rx="6" fill="#dcfce7"/>
        <text x="320" y="15" font-family="sans-serif" font-size="8" fill="#16a34a" font-weight="700">APPROVED</text>
      </g>

      <g transform="translate(0, 95)">
        <circle cx="10" cy="10" r="8" fill="#dcfce7"/>
        <path d="M 6 10 L 9 13 L 14 7" stroke="#16a34a" stroke-width="2" fill="none"/>
        <text x="28" y="14" font-family="sans-serif" font-size="11" fill="#292524" font-weight="600">Official Bureaucracy &amp; Venue Permits</text>
        <rect x="310" y="3" width="70" height="18" rx="6" fill="#dcfce7"/>
        <text x="320" y="15" font-family="sans-serif" font-size="8" fill="#16a34a" font-weight="700">VERIFIED</text>
      </g>

      <g transform="translate(0, 130)">
        <circle cx="10" cy="10" r="8" fill="#dcfce7"/>
        <path d="M 6 10 L 9 13 L 14 7" stroke="#16a34a" stroke-width="2" fill="none"/>
        <text x="28" y="14" font-family="sans-serif" font-size="11" fill="#292524" font-weight="600">Participant Paper Archiving &amp; Scheduling</text>
        <rect x="310" y="3" width="70" height="18" rx="6" fill="#fef3c7"/>
        <text x="320" y="15" font-family="sans-serif" font-size="8" fill="#b45309" font-weight="700">ARCHIVED</text>
      </g>
    </g>
  </g>

  <!-- Dark Gradient Bottom Overlay -->
  <rect width="800" height="500" fill="url(#overlay-sp)"/>

  <!-- Event Caption Tag at bottom left -->
  <rect x="40" y="420" width="310" height="48" rx="12" fill="#1c1917" opacity="0.9" stroke="#44403c"/>
  <text x="56" y="442" font-family="sans-serif" font-size="11" fill="#fbbf24" font-weight="700">DOCUMENTATION HIGHLIGHT</text>
  <text x="56" y="457" font-family="sans-serif" font-size="10" fill="#e7e5e4">Secretariat &amp; Proposal Bureaucracy Management</text>
</svg>

